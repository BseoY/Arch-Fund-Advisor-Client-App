openapi: 3.0.3
info:
  title: Arch Morning View
  version: 0.1.0
  description: |
    HTTP contract for the frontend API client, `ArchService` in
    `frontend/src/services/types.ts`. The UI calls those methods today.
    Each operation below is one method. Field names and values match the
    TypeScript types.

    The frontend does not name a host. This server is the local app.

    Send a session token as `Authorization: Bearer <token>`.
    The UI prints an error body's `detail` string as the message.

    No authentication:
    - GET /advisor
    - POST /advisor
    - POST /login

    Bearer token required:
    - every other operation

    GET /session is the exception among authenticated calls: an unknown
    token returns 200 and `null`, not an error. The sign-in screen treats
    `null` as signed out.

    Advisor only, otherwise 403 "Only the advisor can do that.":
    list, create, update, and delete clients; create, update, and delete
    funds; create, update, and delete documents; set paid.

    The owning client only, otherwise 403 "Only a client can do that.":
    set checked. Another client's document is 404 "Document not found."

    GET /clients/{clientId} is both roles. A client who asks for a
    different client id gets 404 "Client not found."

    Names are unique, compared without case. Passwords are never returned.
    Ids are strings. A missing or unknown bearer token on a required
    route is 401 "Please sign in again."
servers:
  - url: http://127.0.0.1:8000
tags:
  - name: Session
  - name: Clients
  - name: Funds
  - name: Documents
paths:
  /advisor:
    get:
      tags: [Session]
      operationId: hasAdvisor
      summary: Whether an advisor account exists
      description: No authentication. ArchService.hasAdvisor.
      responses:
        "200":
          description: True after the advisor account has been created
          content:
            application/json:
              schema:
                type: boolean
    post:
      tags: [Session]
      operationId: setupAdvisor
      summary: Create the advisor account and sign in
      description: |
        No authentication. ArchService.setupAdvisor.
        Succeeds only when no advisor exists. The name is trimmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Advisor created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorSession"
        "400":
          description: Name and password are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Name and password are required.
        "409":
          description: The advisor already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: The advisor already exists.
  /login:
    post:
      tags: [Session]
      operationId: login
      summary: Sign in
      description: |
        No authentication. ArchService.login.
        The name is trimmed and matched without case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Wrong name or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Wrong name or password.
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Load the session for a stored token
      description: |
        ArchService.getSession. Send the bearer token when one is stored.
        An unknown token returns null. It does not return an error.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The session, or null when the token is unknown
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/Session"
  /logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Sign out
      description: |
        Bearer token required. ArchService.logout.
        An unknown token still returns 204.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List clients
      description: Bearer token required. Advisor only. ArchService.listClients. Sorted by name.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Clients, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
    post:
      tags: [Clients]
      operationId: createClient
      summary: Create a client login
      description: |
        Bearer token required. Advisor only. ArchService.createClient.
        The name is trimmed. It must be unique without case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Name and password are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Name and password are required.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "409":
          description: That name is already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: That name is already used.
  /clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [Clients]
      operationId: getClientOverview
      summary: One client's morning screen
      description: |
        Bearer token required. ArchService.getClientOverview.
        The advisor may open any client. A client may open only their own id.

        `morning` lists unpaid capital calls, soonest due date first.
        Each item has the fund name, title, and amount.
        Funds are sorted by name. Documents under a fund are newest first.
        A capital call includes `paid`. `checked` is included only when the
        caller is that client, and then it is always true or false.
        The advisor's documents do not include `checked`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Morning list, funds, and documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Client not found.
    patch:
      tags: [Clients]
      operationId: updateClient
      summary: Change a client's name or password
      description: |
        Bearer token required. Advisor only. ArchService.updateClient.
        Omitted fields stay as they are. An empty password is ignored.
        A new name is trimmed and must be unique without case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Name is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Name is required.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Client not found.
        "409":
          description: That name is already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: That name is already used.
    delete:
      tags: [Clients]
      operationId: deleteClient
      summary: Delete a client
      description: |
        Bearer token required. Advisor only. ArchService.deleteClient.
        Also deletes that client's login, sessions, funds, and documents.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Client deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: The mock deletes nothing when the id is unknown and still resolves. Return 204.
  /clients/{clientId}/funds:
    post:
      tags: [Funds]
      operationId: createFund
      summary: Add a fund
      description: Bearer token required. Advisor only. ArchService.createFund. The name is trimmed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundWrite"
      responses:
        "201":
          description: Fund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fund"
        "400":
          description: Fund name is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Fund name is required.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Client not found.
  /funds/{fundId}:
    parameters:
      - $ref: "#/components/parameters/FundId"
    patch:
      tags: [Funds]
      operationId: updateFund
      summary: Rename a fund
      description: Bearer token required. Advisor only. ArchService.updateFund. The name is trimmed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundWrite"
      responses:
        "200":
          description: Fund renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fund"
        "400":
          description: Fund name is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Fund name is required.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Fund not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Fund not found.
    delete:
      tags: [Funds]
      operationId: deleteFund
      summary: Delete a fund
      description: |
        Bearer token required. Advisor only. ArchService.deleteFund.
        Also deletes that fund's documents.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Fund deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Fund not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Fund not found.
  /funds/{fundId}/documents:
    post:
      tags: [Documents]
      operationId: createDocument
      summary: File a document on a fund
      description: |
        Bearer token required. Advisor only. ArchService.createDocument.
        A new capital call is unpaid. `createdAt` is the filing time.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundDocument"
        "400":
          $ref: "#/components/responses/InvalidDocument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Fund not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Fund not found.
  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      tags: [Documents]
      operationId: updateDocument
      summary: Replace a document's contents
      description: |
        Bearer token required. Advisor only. ArchService.updateDocument.
        The body is the whole document, including a possible change of kind.
        Paid status and any client checkmark stay as they are.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundDocument"
        "400":
          $ref: "#/components/responses/InvalidDocument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Document not found.
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document
      description: Bearer token required. Advisor only. ArchService.deleteDocument.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Document deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Document not found.
  /documents/{documentId}/paid:
    patch:
      tags: [Documents]
      operationId: setPaid
      summary: Set the real paid status
      description: |
        Bearer token required. Advisor only. ArchService.setPaid.
        Only a capital call has a paid status. No response body.
        Paid true removes the call from `morning`. Paid false puts it back.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidWrite"
      responses:
        "204":
          description: Paid status saved
        "400":
          description: Only capital calls can be paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Only capital calls can be paid.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdvisorOnly"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Document not found.
  /documents/{documentId}/checked:
    patch:
      tags: [Documents]
      operationId: setChecked
      summary: Set the client's own checkmark
      description: |
        Bearer token required. The owning client only. ArchService.setChecked.
        The UI sends this for capital calls. It does not change `paid`.
        No response body. The advisor never receives `checked`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckedWrite"
      responses:
        "204":
          description: Checkmark saved
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Only a client can do that.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Only a client can do that.
        "404":
          description: Document not found. This includes a document owned by another client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Document not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from a Session. Sent on every ArchService method that takes a token.
  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
    FundId:
      name: fundId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Please sign in again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Please sign in again.
    AdvisorOnly:
      description: Only the advisor can do that.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Only the advisor can do that.
    InvalidDocument:
      description: |
        One of: "A document needs a title.", "Amount due must be greater than zero.",
        "Due date is required.", "An investor letter needs a summary.",
        "Unknown document type."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            title:
              value:
                detail: A document needs a title.
            amount:
              value:
                detail: Amount due must be greater than zero.
            dueDate:
              value:
                detail: Due date is required.
            summary:
              value:
                detail: An investor letter needs a summary.
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Shown directly in the UI.
    Credentials:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
          description: Omitted or empty leaves the current password in place.
    Session:
      oneOf:
        - $ref: "#/components/schemas/AdvisorSession"
        - $ref: "#/components/schemas/ClientSession"
      discriminator:
        propertyName: role
        mapping:
          advisor: "#/components/schemas/AdvisorSession"
          client: "#/components/schemas/ClientSession"
    AdvisorSession:
      type: object
      required: [token, role, name]
      properties:
        token:
          type: string
        role:
          type: string
          enum: [advisor]
        name:
          type: string
    ClientSession:
      type: object
      required: [token, role, name, clientId]
      properties:
        token:
          type: string
        role:
          type: string
          enum: [client]
        name:
          type: string
        clientId:
          type: string
    Client:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FundWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Fund:
      type: object
      required: [id, clientId, name]
      properties:
        id:
          type: string
        clientId:
          type: string
        name:
          type: string
    DocumentInput:
      oneOf:
        - $ref: "#/components/schemas/CapitalCallInput"
        - $ref: "#/components/schemas/InvestorLetterInput"
      discriminator:
        propertyName: kind
        mapping:
          capital_call: "#/components/schemas/CapitalCallInput"
          investor_letter: "#/components/schemas/InvestorLetterInput"
    CapitalCallInput:
      type: object
      required: [kind, title, amount, dueDate]
      properties:
        kind:
          type: string
          enum: [capital_call]
        title:
          type: string
          description: Trimmed. Empty is rejected.
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Must be greater than zero.
        dueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    InvestorLetterInput:
      type: object
      required: [kind, title, summary]
      properties:
        kind:
          type: string
          enum: [investor_letter]
        title:
          type: string
          description: Trimmed. Empty is rejected.
        summary:
          type: string
          description: Trimmed. Empty is rejected.
    FundDocument:
      oneOf:
        - $ref: "#/components/schemas/CapitalCall"
        - $ref: "#/components/schemas/InvestorLetter"
      discriminator:
        propertyName: kind
        mapping:
          capital_call: "#/components/schemas/CapitalCall"
          investor_letter: "#/components/schemas/InvestorLetter"
    CapitalCall:
      allOf:
        - $ref: "#/components/schemas/CapitalCallInput"
        - type: object
          required: [id, fundId, createdAt, paid]
          properties:
            id:
              type: string
            fundId:
              type: string
            createdAt:
              type: string
              format: date-time
            paid:
              type: boolean
            checked:
              type: boolean
              description: Present only on the owning client's overview. Absent for the advisor.
    InvestorLetter:
      allOf:
        - $ref: "#/components/schemas/InvestorLetterInput"
        - type: object
          required: [id, fundId, createdAt]
          properties:
            id:
              type: string
            fundId:
              type: string
            createdAt:
              type: string
              format: date-time
    PaidWrite:
      type: object
      required: [paid]
      properties:
        paid:
          type: boolean
    CheckedWrite:
      type: object
      required: [checked]
      properties:
        checked:
          type: boolean
    MorningItem:
      type: object
      required: [documentId, fundId, fundName, title, amount, dueDate]
      properties:
        documentId:
          type: string
        fundId:
          type: string
        fundName:
          type: string
        title:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
    FundWithDocuments:
      allOf:
        - $ref: "#/components/schemas/Fund"
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items:
                $ref: "#/components/schemas/FundDocument"
    ClientOverview:
      type: object
      required: [client, morning, funds]
      properties:
        client:
          $ref: "#/components/schemas/Client"
        morning:
          type: array
          description: Unpaid capital calls, soonest due date first.
          items:
            $ref: "#/components/schemas/MorningItem"
        funds:
          type: array
          description: Sorted by fund name. Each fund's documents are newest first.
          items:
            $ref: "#/components/schemas/FundWithDocuments"
